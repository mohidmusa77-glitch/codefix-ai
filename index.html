<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeFix AI</title>
    <style>
        body { background-color: #050a14; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; }
        .workspace { width: 100%; max-width: 500px; background: #0c1524; border: 1px solid #1f2937; border-radius: 12px; padding: 20px; }
        textarea { width: 100%; height: 150px; background: #050a14; color: #fff; border: 1px solid #1f2937; border-radius: 8px; padding: 10px; }
        .btn-fix { width: 100%; background: #0ea5e9; border: none; color: white; padding: 12px; border-radius: 8px; margin-top: 10px; cursor: pointer; }
        #outputBox { margin-top: 15px; padding: 10px; border: 1px dashed #374151; border-radius: 8px; color: #94a3b8; }
        .card { background: #0c1524; border: 1px solid #1f2937; padding: 20px; border-radius: 12px; margin-top: 20px; width: 100%; max-width: 500px; }
    </style>
</head>
<body>

    <h1>CodeFix AI 🤖</h1>
    <div class="workspace">
        <textarea id="codeInput" placeholder="Paste your broken code..."></textarea>
        <button class="btn-fix" id="fixBtn" onclick="fixCode()">⚡ Fix My Code</button>
        <div id="outputBox">Fixed code will display here...</div>
    </div>

    <!-- Subscription Cards -->
    <div class="card">
        <h3>2-Week Pass - $5</h3>
        <p>Unlimited fixes for 14 days.</p>
        <button class="btn-fix">Get 2-Week Access</button>
    </div>

    <script>
        let freeTries = 2; // Free Trials

        async function fixCode() {
            if (freeTries <= 0) { alert("Please subscribe to continue."); return; }
            
            const input = document.getElementById('codeInput').value;
            const outputBox = document.getElementById('outputBox');
            
            outputBox.innerText = "Thinking...";

            try {
                // Key-Safe Proxy Call
                const response = await fetch('/.netlify/functions/fixCode', {
                    method: "POST",
                    body: JSON.stringify({ code: input })
                });
                const data = await response.json();
                outputBox.innerText = data.result;
                freeTries--;
            } catch (e) {
                outputBox.innerText = "Error connecting to AI.";
            }
        }
    </script>
</body>
</html>
