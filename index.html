<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeFix AI - Professional AI Tool</title>
    <style>
        :root { --bg: #050a14; --accent: #0ea5e9; --text: #ffffff; }
        * { box-sizing: border-box; font-family: 'Inter', sans-serif; }
        
        body { 
            background: radial-gradient(circle at top right, #1e293b, #050a14); 
            color: var(--text); margin: 0; padding: 40px 20px;
            display: flex; flex-direction: column; align-items: center; min-height: 100vh;
        }

        h1 { font-size: 42px; background: linear-gradient(to right, #fff, #94a3b8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .glass-container { 
            background: rgba(12, 21, 36, 0.7); 
            backdrop-filter: blur(20px); 
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px; padding: 30px; width: 100%; max-width: 550px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8); margin-bottom: 30px;
        }

        /* File Upload & Workspace */
        .drop-zone { 
            border: 2px dashed #1f2937; border-radius: 12px; padding: 40px; 
            text-align: center; color: #94a3b8; cursor: pointer; transition: 0.3s;
        }
        .drop-zone:hover { border-color: var(--accent); }
        
        .fix-btn { 
            width: 100%; background: linear-gradient(135deg, #0ea5e9, #6366f1); 
            border: none; padding: 18px; border-radius: 12px; color: white; 
            font-weight: 800; cursor: pointer; margin-top: 20px; transition: 0.3s;
        }
        .fix-btn:hover { box-shadow: 0 0 25px rgba(14, 165, 233, 0.5); }

        /* Pricing Cards */
        .card { background: rgba(12, 21, 36, 0.7); border: 1px solid #1f2937; padding: 25px; border-radius: 20px; width: 100%; max-width: 550px; margin-bottom: 20px; position: relative; }
        .price { font-size: 36px; font-weight: 900; margin: 10px 0; }
        .btn-sub { width: 100%; background: #1e293b; color: white; padding: 15px; border-radius: 12px; border: 1px solid #334155; cursor: pointer; }
    </style>
</head>
<body>

    <h1>CodeFix AI 🤖</h1>

    <!-- File Workspace -->
    <div class="glass-container">
        <div class="drop-zone" onclick="document.getElementById('fileInput').click()">
            <p>📁 Drag & Drop files or click to upload</p>
            <input type="file" id="fileInput" hidden>
        </div>
        <button class="fix-btn">⚡ Auto-Fix My Files</button>
        <div id="status" style="margin-top:20px; color:#0ea5e9;">Ready to process...</div>
    </div>

    <!-- Pricing Section -->
    <div class="card">
        <h3>FREE TIER</h3>
        <div class="price">$0</div>
        <p style="color:#94a3b8">2 free file optimizations total.</p>
        <button class="btn-sub">2 fixes remaining</button>
    </div>

    <div class="card" style="border-color: var(--accent);">
        <div style="background: var(--accent); padding: 5px 15px; border-radius: 20px; font-size: 10px; position: absolute; top: -10px; right: 20px;">MOST POPULAR</div>
        <div style="font-size:24px">👑</div>
        <h3>MONTHLY PREMIUM</h3>
        <div class="price">$10 <span>/ month</span></div>
        <button class="btn-sub" style="background: var(--accent);">Go Premium</button>
    </div>

</body>
</html>
