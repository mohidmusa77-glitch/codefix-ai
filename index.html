<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeFix AI - Ultra Premium</title>
    <style>
        :root { --bg: #050a14; --accent: #0ea5e9; }
        * { box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { 
            background: radial-gradient(circle at top right, #1e293b, #050a14); 
            color: #fff; min-height: 100vh; margin: 0; 
            display: flex; flex-direction: column; align-items: center; padding: 40px 20px; 
        }
        
        .glass-card { 
            background: rgba(12, 21, 36, 0.7); 
            backdrop-filter: blur(15px); 
            border: 1px solid rgba(255,255,255,0.1); 
            border-radius: 20px; padding: 25px; width: 100%; max-width: 500px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.8); margin-bottom: 25px;
        }

        h1 { 
            background: linear-gradient(to right, #fff, #94a3b8);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-align: center; font-size: 40px; margin-bottom: 30px;
        }

        textarea { 
            width: 100%; height: 180px; background: #050a14; color: #fff; 
            border: 1px solid #1f2937; border-radius: 12px; padding: 15px; resize: none;
        }

        .fix-btn { 
            width: 100%; background: linear-gradient(135deg, #0ea5e9, #6366f1); 
            border: none; padding: 16px; border-radius: 12px; font-weight: bold; 
            color: white; cursor: pointer; transition: 0.3s;
        }
        .fix-btn:hover { box-shadow: 0 0 20px rgba(14, 165, 233, 0.6); }

        .price { font-size: 32px; font-weight: 800; margin: 10px 0; }
        .badge { background: var(--accent); padding: 4px 12px; border-radius: 20px; font-size: 10px; position: absolute; top: -10px; right: 20px; font-weight: 800; }
        .btn-pay { width: 100%; background: #1e293b; color: white; border: 1px solid #334155; padding: 14px; border-radius: 12px; cursor: pointer; }
    </style>
</head>
<body>

    <h1>CodeFix AI 🤖</h1>

    <div class="glass-card">
        <textarea id="codeInput" placeholder="Paste your broken code here..."></textarea>
        <button class="fix-btn" id="fixBtn" onclick="fixCode()">⚡ Fix My Code</button>
        <div id="outputBox" style="margin-top:20px; color:#94a3b8; font-size:14px;">Fixed code will appear here...</div>
    </div>

    <div class="glass-card">
        <h3>FREE TIER</h3>
        <div class="price">$0</div>
        <p style="color:#94a3b8">2 free fixes total.</p>
        <button class="btn-pay" id="subBtn">2 fixes remaining</button>
    </div>

    <div class="glass-card" style="border-color: var(--accent);">
        <span class="badge">Most Popular</span>
        <div style="font-size:24px">👑</div>
        <h3>MONTHLY PREMIUM</h3>
        <div class="price">$10 <span>/ month</span></div>
        <button class="btn-pay" style="background: var(--accent);">Go Premium</button>
    </div>

    <script>
        let freeTries = 2;
        async function fixCode() {
            if (freeTries <= 0) { alert("Free trials finished!"); return; }
            const input = document.getElementById('codeInput').value;
            const outputBox = document.getElementById('outputBox');
            outputBox.innerText = "Processing...";
            try {
                const response = await fetch('/.netlify/functions/fixCode', {
                    method: "POST", body: JSON.stringify({ code: input })
                });
                const data = await response.json();
                outputBox.innerText = data.result;
                freeTries--;
                document.getElementById('subBtn').innerText = freeTries + " fixes remaining";
            } catch (e) { outputBox.innerText = "Error connecting to AI."; }
        }
    </script>
</body>
</html>
