<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CodeFix AI - Premium Pro</title>
    <style>
        :root { --accent: #0ea5e9; --bg: #050a14; --card: #0c1524; }
        body { background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; padding: 40px 20px; }
        
        /* Premium Gradient Heading */
        h1 { font-size: 48px; background: linear-gradient(to right, #38bdf8, #6366f1); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 10px; }
        
        /* Glassmorphism Workspace */
        .workspace { width: 100%; max-width: 550px; background: var(--card); border: 1px solid #1f2937; border-radius: 16px; padding: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); backdrop-filter: blur(10px); }
        textarea { width: 100%; height: 220px; background: #050a14; color: #e2e8f0; border: 1px solid #1f2937; border-radius: 12px; padding: 16px; outline: none; font-family: monospace; transition: 0.3s; }
        textarea:focus { border-color: var(--accent); box-shadow: 0 0 10px rgba(14, 165, 233, 0.2); }
        
        /* Premium Button */
        .btn-fix { width: 100%; background: linear-gradient(135deg, #0ea5e9, #6366f1); color: white; border: none; padding: 16px; border-radius: 10px; font-weight: 700; cursor: pointer; transition: 0.3s; }
        .btn-fix:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(14, 165, 233, 0.4); }

        /* Pricing Cards - Professional Look */
        .pricing-section { width: 100%; max-width: 550px; display: grid; gap: 20px; }
        .card { background: var(--card); border: 1px solid #1f2937; padding: 30px; border-radius: 16px; position: relative; }
        .card.active { border-color: var(--accent); }
        .price-tag { font-size: 32px; font-weight: 800; margin: 10px 0; }
        .btn-pay { width: 100%; background: transparent; border: 1px solid #374151; color: white; padding: 14px; border-radius: 8px; cursor: pointer; font-weight: 600; transition: 0.3s; }
        .btn-pay:hover { background: var(--accent); border-color: var(--accent); }
    </style>
</head>
<body>

    <h1>CodeFix AI 🤖</h1>
    
    <div class="workspace">
        <textarea id="codeInput" placeholder="Paste your broken code here..."></textarea>
        <button class="btn-fix" id="fixBtn" onclick="fixCode()">⚡ Fix My Code</button>
        <div id="outputBox" style="margin-top: 20px; color: #94a3b8; font-size: 14px; min-height: 50px;">Fixed code will display here...</div>
    </div>

    <div class="pricing-section">
        <div class="card">
            <h3>2-Week Pass</h3>
            <div class="price-tag">$5</div>
            <p style="color:#94a3b8">Unlimited access for 14 days.</p>
            <button class="btn-pay">Get 2-Week Access</button>
        </div>
        <div class="card active">
            <div style="position:absolute; top:-12px; left:50%; transform:translateX(-50%); background:var(--accent); padding:4px 15px; border-radius:20px; font-size:12px; font-weight:700;">MOST POPULAR</div>
            <h3>Monthly Premium</h3>
            <div class="price-tag">$10</div>
            <p style="color:#94a3b8">Unlimited fixes for pros.</p>
            <button class="btn-pay">Get Monthly Access</button>
        </div>
    </div>

    <script>
        async function fixCode() {
            const input = document.getElementById('codeInput').value;
            const outputBox = document.getElementById('outputBox');
            const fixBtn = document.getElementById('fixBtn');

            if (!input) { alert("Please paste code!"); return; }
            fixBtn.innerText = "Processing...";
            fixBtn.disabled = true;

            try {
                const res = await fetch('/.netlify/functions/fixCode', {
                    method: "POST",
                    body: JSON.stringify({ code: input })
                });
                const data = await res.json();
                outputBox.innerText = data.result;
            } catch (e) {
                outputBox.innerText = "Error: Check your server setup.";
            } finally {
                fixBtn.innerText = "⚡ Fix My Code";
                fixBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
