<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeFix AI - Premium</title>
    <style>
        :root { --bg: #050a14; --card: #0c1524; --accent: #0ea5e9; --text: #ffffff; --muted: #94a3b8; }
        * { box-sizing: border-box; font-family: 'Inter', -apple-system, sans-serif; }
        body { background: var(--bg); color: var(--text); display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; min-height: 100vh; }
        
        .header { text-align: center; margin-bottom: 30px; }
        .robot { font-size: 50px; margin-bottom: 10px; }
        
        .workspace { width: 100%; max-width: 500px; background: var(--card); border: 1px solid #1f2937; border-radius: 16px; padding: 20px; margin-bottom: 40px; }
        textarea { width: 100%; height: 180px; background: #050a14; color: #fff; border: 1px solid #1f2937; border-radius: 8px; padding: 15px; resize: none; font-family: monospace; }
        .fix-btn { width: 100%; background: var(--accent); color: white; border: none; padding: 16px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 15px; }
        #outputBox { margin-top: 20px; padding: 15px; background: #050a14; border: 1px dashed #1f2937; border-radius: 8px; color: var(--muted); min-height: 60px; font-size: 14px; white-space: pre-wrap; }

        .pricing-section { width: 100%; max-width: 500px; }
        .card { background: var(--card); border: 1px solid #1f2937; border-radius: 16px; padding: 25px; margin-bottom: 20px; position: relative; }
        .badge { background: var(--accent); color: white; padding: 4px 12px; border-radius: 20px; font-size: 10px; position: absolute; top: -10px; right: 20px; font-weight: bold; text-transform: uppercase; }
        .price { font-size: 28px; font-weight: bold; margin: 10px 0; }
        .feature { display: flex; align-items: center; gap: 10px; color: var(--muted); margin-bottom: 8px; font-size: 14px; }
        .pay-btn { width: 100%; background: #1e293b; color: white; border: 1px solid #334155; padding: 14px; border-radius: 8px; margin-top: 20px; cursor: pointer; font-weight: 600; }
        .premium-btn { background: linear-gradient(90deg, #0ea5e9, #6366f1); border: none; }
    </style>
</head>
<body>

    <div class="header">
        <div class="robot">🤖</div>
        <h1>CodeFix AI</h1>
        <p style="color:var(--muted)">Paste broken code. Get working code.</p>
    </div>

    <div class="workspace">
        <textarea id="codeInput" placeholder="Drop your broken code here..."></textarea>
        <button class="fix-btn" id="fixBtn" onclick="fixCode()">⚡ Fix My Code</button>
        <div id="outputBox">Fixed code will appear here...</div>
    </div>

    <div class="pricing-section">
        <h2 style="text-align:center; margin-bottom:20px;">Simple, honest pricing</h2>

        <!-- Free Tier -->
        <div class="card">
            <h3>FREE TIER</h3>
            <div class="price" id="statusText">$0</div>
            <div class="feature">✅ <span id="triesCount">2</span> free fixes remaining</div>
            <div class="feature">✅ JavaScript, Python & more</div>
            <button class="pay-btn" id="subBtn">2 fixes remaining</button>
        </div>

        <!-- Monthly Premium -->
        <div class="card" style="border-color:var(--accent);">
            <span class="badge">Most Popular</span>
            <div style="font-size:24px">👑</div>
            <h3>MONTHLY PREMIUM</h3>
            <div class="price">$10 <span>/ month</span></div>
            <div class="feature">✅ Unlimited fixes forever</div>
            <button class="pay-btn premium-btn">Go Premium</button>
        </div>
    </div>

    <script>
        let freeTries = 2;

        async function fixCode() {
            if (freeTries <= 0) { 
                alert("Free trials finished! Please subscribe."); 
                return; 
            }
            
            const input = document.getElementById('codeInput').value;
            const outputBox = document.getElementById('outputBox');
            const triesCount = document.getElementById('triesCount');
            const subBtn = document.getElementById('subBtn');

            if (!input) { alert("Please paste some code!"); return; }

            outputBox.innerText = "Processing...";

            try {
                const response = await fetch('/.netlify/functions/fixCode', {
                    method: "POST",
                    body: JSON.stringify({ code: input })
                });
                const data = await response.json();
                outputBox.innerText = data.result;
                
                freeTries--;
                triesCount.innerText = freeTries;
                subBtn.innerText = freeTries + " fixes remaining";
            } catch (e) {
                outputBox.innerText = "Error: Check Netlify function setup.";
            }
        }
    </script>
</body>
</html>
