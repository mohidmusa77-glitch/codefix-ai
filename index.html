<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeFix AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: #0b111e; color: #f1f5f9; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; min-height: 100vh; margin: 0; padding: 40px 20px; }
        .top-badge { background: rgba(14, 165, 233, 0.1); border: 1px solid rgba(14, 165, 233, 0.2); color: #38bdf8; padding: 6px 16px; border-radius: 9999px; font-size: 13px; font-weight: 600; margin-bottom: 20px; }
        h1 { font-size: 42px; font-weight: 700; margin: 0 0 10px 0; background: linear-gradient(to right, #38bdf8, #6366f1); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-align: center; }
        .subtitle { color: #64748b; font-size: 16px; margin: 0 0 20px 0; text-align: center; }
        .workspace { width: 100%; max-width: 550px; background: #111827; border: 1px solid #1f2937; border-radius: 12px; padding: 20px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5); margin-bottom: 25px; }
        .editor-container { position: relative; background: #0b111e; border: 1px solid #1f2937; border-radius: 8px; padding: 15px; }
        textarea { width: 100%; height: 200px; background: transparent; color: #cbd5e1; border: none; resize: none; outline: none; font-family: 'Courier New', Courier, monospace; font-size: 14px; }
        .btn-fix { width: 100%; background: #0ea5e9; color: white; border: none; padding: 12px; font-size: 15px; font-weight: 600; border-radius: 8px; cursor: pointer; margin-top: 15px; }
        #outputBox { margin-top: 15px; padding: 15px; background: #0b111e; border: 1px dashed #1f2937; border-radius: 8px; min-height: 40px; font-size: 14px; color: #94a3b8; white-space: pre-wrap; }
        
        /* Pricing Cards Styles */
        .pricing-section { width: 100%; max-width: 550px; display: flex; flex-direction: column; gap: 20px; }
        .card { background: #111827; border: 1px solid #1f2937; border-radius: 12px; padding: 25px; }
        .price-tag { font-size: 24px; font-weight: 700; color: white; }
        .btn-pay { width: 100%; background: #1f2937; color: white; border: 1px solid #374151; padding: 12px; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="top-badge">✨ The No-BS Code Doctor</div>
    <h1>CodeFix AI 🤖</h1>
    <div class="subtitle">Paste broken code. Get working code.</div>

    <div class="workspace">
        <textarea id="codeInput" placeholder="Drop your broken code here..."></textarea>
        <button class="btn-fix" id="fixBtn" onclick="fixCode()">⚡ Fix My Code</button>
        <div id="outputBox">Fixed code will display here...</div>
    </div>

    <div class="pricing-section">
        <div class="card">
            <h3>2-Week Pass</h3>
            <div class="price-tag">$5</div>
            <button class="btn-pay" onclick="alert('Redirecting...')">Get 2-Week Access</button>
        </div>
        <div class="card">
            <h3>Monthly Premium</h3>
            <div class="price-tag">$10</div>
            <button class="btn-pay" onclick="alert('Redirecting...')">Get Monthly Access</button>
        </div>
    </div>

    <script>
        const GEMINI_API_KEY = 'AQ.Ab8RN6KKuXiJwPaj0YizUEFTnPuMPYSV8Ya7WNRoUf0mgLmNRQ'; 
        
        async function fixCode() {
            const input = document.getElementById('codeInput').value;
            const outputBox = document.getElementById('outputBox');
            const fixBtn = document.getElementById('fixBtn');

            if (input.trim() === "") { alert("Please paste code!"); return; }
            
            fixBtn.innerText = "Fixing...";
            fixBtn.disabled = true;
            outputBox.innerText = "Thinking...";

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ contents: [{ parts: [{ text: "Fix this code:\n" + input }] }] })
                });

                const data = await response.json();
                outputBox.innerText = data.candidates[0].content.parts[0].text;
            } catch (error) {
                outputBox.innerText = "Error: Could not connect.";
            } finally {
                fixBtn.innerText = "⚡ Fix My Code";
                fixBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
