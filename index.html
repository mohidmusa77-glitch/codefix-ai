<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeFix AI - Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }
        body { 
            background: radial-gradient(circle at top, #1e1b4b 0%, #0f172a 100%);
            color: #f8fafc; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container { 
            width: 100%;
            max-width: 650px; 
            padding: 30px;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            margin-bottom: 25px;
        }
        h1 {
            color: #38bdf8;
            font-size: 32px;
            font-weight: 700;
            margin-top: 0;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
        }
        p {
            color: #94a3b8;
            margin-bottom: 20px;
        }
        .tries-count {
            background: rgba(56, 189, 248, 0.1);
            color: #38bdf8;
            padding: 6px 16px;
            border-radius: 9999px;
            font-size: 13px;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 20px;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }
        textarea { 
            width: 100%; 
            height: 140px; 
            background: #0f172a;
            color: #f1f5f9;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 15px;
            font-size: 15px;
            resize: none;
            outline: none;
            transition: 0.2s;
        }
        textarea:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.2);
        }
        .btn-fix { 
            width: 100%; 
            background: linear-gradient(135deg, #38bdf8 0%, #0ea5e9 100%);
            color: #0f172a;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 15px;
            transition: 0.2s;
            box-shadow: 0 4px 12px rgba(14, 165, 233, 0.3);
        }
        .btn-fix:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(14, 165, 233, 0.4);
        }
        #outputBox { 
            margin-top: 20px; 
            padding: 15px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px dashed #334155;
            border-radius: 10px;
            min-height: 50px;
            text-align: left;
            color: #cbd5e1;
            font-size: 14px;
        }
        /* Premium Pricing Cards */
        .pricing-section {
            width: 100%;
            max-width: 650px;
            display: flex;
            gap: 20px;
            justify-content: space-between;
        }
        .card {
            flex: 1;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 25px 20px;
            text-align: center;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            transition: 0.3s;
            position: relative;
        }
        .card.active {
            border-color: #38bdf8;
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.15);
            transform: scale(1.03);
        }
        .badge {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            background: #38bdf8;
            color: #0f172a;
            padding: 2px 12px;
            font-size: 11px;
            font-weight: 700;
            border-radius: 9999px;
            text-transform: uppercase;
        }
        .card h3 {
            margin: 0 0 10px 0;
            color: #f1f5f9;
            font-size: 18px;
        }
        .price {
            font-size: 36px;
            font-weight: 700;
            color: #38bdf8;
            margin-bottom: 15px;
        }
        .price span {
            font-size: 14px;
            color: #94a3b8;
            font-weight: 400;
        }
        .card p {
            font-size: 13px;
            line-height: 1.5;
            margin-bottom: 20px;
        }
        .btn-pay {
            width: 100%;
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            color: white;
            border: none;
            padding: 12px;
            font-weight: 700;
            font-size: 14px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.2);
        }
        .btn-pay:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(34, 197, 94, 0.3);
        }
        .highlight {
            animation: shake 0.5s ease-in-out;
            border-color: #ef4444 !important;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.3) !important;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            50% { transform: translateX(6px); }
            75% { transform: translateX(-6px); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>CodeFix AI</h1>
        <div class="tries-count" id="triesDisplay">✨ Free Tries Left: 2</div>
        <p>Paste your broken code below and watch the AI magic happen.</p>
        <textarea id="codeInput" placeholder="// Paste your messy or broken code here..."></textarea>
        <button class="btn-fix" onclick="fixCode()">Fix My Code ⚡</button>
        <div id="outputBox">Fixed code will display here...</div>
    </div>

    <div class="pricing-section" id="pricingSection">
        <div class="card" id="card1">
            <h3>2 Weeks Pass</h3>
            <div class="price">$5<span> / 14 days</span></div>
            <p>Perfect for quick debugging and short projects.</p>
            <button class="btn-pay" onclick="alert('Redirecting to Payment Gateway...')">Activate Pass</button>
        </div>
        
        <div class="card active" id="card2">
            <div class="badge">Most Popular</div>
            <h3>Monthly Plan</h3>
            <div class="price">$15<span> / mo</span></div>
            <p>Unlimited AI fixing, optimization, and premium support.</p>
            <button class="btn-pay" onclick="alert('Redirecting to Payment Gateway...')">Go Pro Now</button>
        </div>
    </div>

    <script>
        let freeTries = 2;

        function fixCode() {
            const input = document.getElementById('codeInput').value;
            const outputBox = document.getElementById('outputBox');
            const triesDisplay = document.getElementById('triesDisplay');
            const card1 = document.getElementById('card1');
            const card2 = document.getElementById('card2');

            if (freeTries > 0) {
                if (input.trim() === "") {
                    alert("Please paste some code first!");
                    return;
                }
                freeTries--;
                triesDisplay.innerText = "✨ Free Tries Left: " + freeTries;
                outputBox.innerHTML = "<strong style='color: #22c55e;'>✔ AI Response:</strong><br><code style='color: #a7f3d0;'>// Code fixed successfully! (Your high-quality layout looks beautiful now!)</code>";
            } else {
                alert("Aapke free tries khatam ho gaye hain! Please continue karne ke liye neeche se premium membership select karein.");
                card1.classList.add('highlight');
                card2.classList.add('highlight');
                setTimeout(() => {
                    card1.classList.remove('highlight');
                    card2.classList.remove('highlight');
                }, 1000);
            }
        }
    </script>

</body>
</html>
