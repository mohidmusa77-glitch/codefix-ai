<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeFix AI - Premium</title>
    <style>
        body { 
            background: #0f172a; 
            color: white; 
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container { 
            width: 100%;
            max-width: 600px; 
            padding: 20px;
            background: #1e293b;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }
        h1 {
            color: #38bdf8;
            margin-top: 0;
        }
        .tries-count {
            background: #334155;
            color: #38bdf8;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 15px;
        }
        textarea { 
            width: 100%; 
            height: 120px; 
            background: #334155;
            color: white;
            border: 1px solid #475569;
            border-radius: 4px;
            padding: 10px;
            box-sizing: border-box;
            font-size: 16px;
            resize: none;
        }
        .btn-fix { 
            width: 100%; 
            background: #38bdf8; 
            color: #0f172a;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-fix:hover {
            background: #0ea5e9;
        }
        #outputBox { 
            margin-top: 15px; 
            padding: 15px;
            background: #334155;
            border-radius: 4px;
            min-height: 40px;
            text-align: left;
        }
        /* Pricing Cards Styling */
        .pricing-section {
            width: 100%;
            max-width: 600px;
            display: flex;
            gap: 15px;
            justify-content: space-between;
        }
        .card {
            flex: 1;
            background: #1e293b;
            border: 2px solid #475569;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: 0.3s;
        }
        .card.active {
            border-color: #38bdf8;
            transform: scale(1.02);
        }
        .card h3 {
            margin: 0 0 10px 0;
            color: #38bdf8;
        }
        .price {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .btn-pay {
            width: 100%;
            background: #22c55e;
            color: white;
            border: none;
            padding: 8px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-pay:hover {
            background: #16a34a;
        }
        .highlight {
            animation: shake 0.5s;
            border-color: #ef4444 !important;
        }
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
            100% { transform: translateX(0); }
        }
    </style>
</head>
<body>

    <!-- Main AI Fixer Block -->
    <div class="container">
        <h1>CodeFix AI</h1>
        <div class="tries-count" id="triesDisplay">Free Tries Left: 2</div>
        <p>Enter your broken code below to fix it:</p>
        <textarea id="codeInput" placeholder="Paste your code here..."></textarea>
        <button class="btn-fix" onclick="fixCode()">Fix Code</button>
        <div id="outputBox">Output will appear here...</div>
    </div>

    <!-- Membership Plans Block -->
    <div class="pricing-section" id="pricingSection">
        <!-- 2 Weeks Plan -->
        <div class="card" id="card1">
            <h3>2 Weeks Access</h3>
            <div class="price">$5</div>
            <p style="font-size: 14px; color: #94a3b8;">Get premium AI code fixing for 14 days.</p>
            <button class="btn-pay" onclick="alert('Redirecting to Payment Gateway...')">Pay $5 Now</button>
        </div>
        
        <!-- Full Month Plan -->
        <div class="card active" id="card2">
            <h3>Monthly Plan</h3>
            <div class="price">$15</div>
            <p style="font-size: 14px; color: #94a3b8;">Unlimited access for a whole month.</p>
            <button class="btn-pay" onclick="alert('Redirecting to Payment Gateway...')">Pay $15 Now</button>
        </div>
    </div>

    <script>
        let freeTries = 2;

        function fixCode() {
            const input = document.getElementById('codeInput').value;
            const outputBox = document.getElementById('outputBox');
            const triesDisplay = document.getElementById('triesDisplay');
            const card1 = document.getElementById('card1');
            const card2 = document.getElementById('card2');

            if (freeTries > 0) {
                if (input.trim() === "") {
                    alert("Please paste some code first!");
                    return;
                }
                freeTries--;
                triesDisplay.innerText = "Free Tries Left: " + freeTries;
                outputBox.innerHTML = "<strong>AI Response:</strong> Code fixed successfully! (Simulated response)";
            } else {
                alert("Aapke 2 Free Tries khatam ho gaye hain! Baaki features use karne ke liye neeche se plan select karein.");
                card1.classList.add('highlight');
                card2.classList.add('highlight');
                setTimeout(() => {
                    card1.classList.remove('highlight');
                    card2.classList.remove('highlight');
                }, 1000);
            }
        }
    </script>

</body>
</html>
