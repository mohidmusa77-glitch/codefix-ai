<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CodeFix AI - Ultra Premium</title>
    <style>
        :root { --bg: #050a14; --card: #0c1524; --accent: #0ea5e9; --glow: rgba(14, 165, 233, 0.3); }
        body { background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; display: flex; flex-direction: column; align-items: center; padding: 40px 20px; margin: 0; }
        
        /* Futuristic Heading */
        .header { text-align: center; margin-bottom: 40px; }
        .robot-icon { font-size: 60px; filter: drop-shadow(0 0 15px var(--accent)); animation: glow 2s infinite alternate; }
        @keyframes glow { from { filter: drop-shadow(0 0 5px var(--accent)); } to { filter: drop-shadow(0 0 20px var(--accent)); } }
        h1 { font-size: 48px; background: linear-gradient(to right, #fff, #94a3b8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* Premium Cards */
        .card { background: linear-gradient(145deg, #0c1524, #050a14); border: 1px solid #1f2937; padding: 30px; border-radius: 20px; margin-bottom: 25px; position: relative; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .premium-card { border: 1px solid var(--accent); box-shadow: 0 0 20px rgba(14, 165, 233, 0.1); }
        .crown { font-size: 30px; color: gold; margin-bottom: 10px; }
        .price { font-size: 40px; font-weight: 800; margin: 10px 0; }
        
        /* Futuristic Buttons */
        .btn-pro { width: 100%; background: linear-gradient(90deg, #0ea5e9, #6366f1); color: white; border: none; padding: 18px; border-radius: 12px; font-weight: 700; cursor: pointer; transition: 0.4s; text-transform: uppercase; letter-spacing: 1px; }
        .btn-pro:hover { box-shadow: 0 0 25px var(--accent); transform: scale(1.02); }
        
        .badge-popular { background: var(--accent); padding: 4px 15px; border-radius: 20px; font-size: 10px; font-weight: 800; position: absolute; top: 15px; right: 20px; }
        .check { color: var(--accent); margin-right: 10px; }
    </style>
</head>
<body>

    <div class="header">
        <div class="robot-icon">🤖</div>
        <h1>CodeFix AI</h1>
    </div>

    <div class="pricing-container" style="width: 100%; max-width: 500px;">
        
        <!-- 2-Week Pass -->
        <div class="card">
            <h3>2-WEEK PASS</h3>
            <div class="price">$5 <span>/ 2 weeks</span></div>
            <p style="color:#94a3b8">Perfect for quick debug sessions.</p>
            <div style="margin: 20px 0;">
                <p><span class="check">✔</span> Unlimited fixes for 2 weeks</p>
                <p><span class="check">✔</span> Priority processing</p>
            </div>
            <button class="btn-pro" style="background:#1e293b">Get 2-Week Access</button>
        </div>

        <!-- Monthly Premium (Ultra Futuristic) -->
        <div class="card premium-card">
            <span class="badge-popular">MOST POPULAR</span>
            <div class="crown">👑</div>
            <h3>MONTHLY PREMIUM</h3>
            <div class="price">$10 <span>/ month</span></div>
            <p style="color:#94a3b8">For large files & complex projects.</p>
            <div style="margin: 20px 0;">
                <p><span class="check">✔</span> Unlimited fixes forever</p>
                <p><span class="check">✔</span> Large file support</p>
                <p><span class="check">✔</span> Early access to new features</p>
            </div>
            <button class="btn-pro">Go Premium</button>
        </div>
    </div>

</body>
</html>
