<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeFix AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Aapka Design CSS waisa hi hai, maine bas color ko thoda set kiya hai */
        * { box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: #0b111e; color: #f1f5f9; display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; padding: 40px 20px; }
        .workspace { width: 100%; max-width: 550px; background: #111827; border: 1px solid #1f2937; border-radius: 12px; padding: 20px; }
        textarea { width: 100%; height: 200px; background: transparent; color: #cbd5e1; border: 1px solid #1f2937; border-radius: 8px; padding: 10px; resize: none; outline: none; }
        .btn-fix { width: 100%; background: #0ea5e9; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; margin-top: 10px; font-weight: 600; }
        #outputBox { margin-top: 15px; padding: 15px; background: #0b111e; border: 1px dashed #1f2937; border-radius: 8px; color: #94a3b8; white-space: pre-wrap; min-height: 50px; }
    </style>
</head>
<body>

    <h1>CodeFix AI 🤖</h1>
    <div class="workspace">
        <textarea id="codeInput" placeholder="Paste broken code here..."></textarea>
        <button class="btn-fix" id="fixBtn" onclick="fixCode()">⚡ Fix My Code</button>
        <div id="outputBox">Fixed code will display here...</div>
    </div>

    <script>
        async function fixCode() {
            const input = document.getElementById('codeInput').value;
            const outputBox = document.getElementById('outputBox');
            const fixBtn = document.getElementById('fixBtn');

            if (input.trim() === "") { alert("Please paste some code first!"); return; }
            
            fixBtn.innerText = "Fixing with Gemini AI...";
            fixBtn.disabled = true;
            outputBox.innerText = "Thinking...";

            try {
                // MUSA: Yahan main API Key hata raha hoon aur ek Proxy function call kar raha hoon
                const response = await fetch('/.netlify/functions/fixCode', {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ code: input })
                });

                const data = await response.json();
                outputBox.innerText = data.result || "Error: AI didn't return a response.";
            } catch (error) {
                outputBox.innerText = "Error: Please set up the 'fixCode.js' function in Netlify.";
            } finally {
                fixBtn.innerText = "⚡ Fix My Code";
                fixBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
